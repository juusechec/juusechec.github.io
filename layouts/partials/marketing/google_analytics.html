{{- $ga := site.Params.marketing.google_analytics | default "" -}}
{{- if and hugo.IsProduction $ga -}}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ $ga | urlquery }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ $ga | js }}'{{ if site.Params.privacy_pack }}, {'anonymize_ip': true}{{ end }});
</script>
{{- end -}}
